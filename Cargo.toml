[package]
name = "absolute-backtest"
version = "0.1.0"
edition = "2021"
description = "Strategy DSL v1: typed IR, well-formedness checker, and backtesting kernel"
license = "MIT"

[lib]
name = "absolute_backtest"
path = "src/lib.rs"

[[bin]]
name = "abt"
path = "src/bin/abt.rs"

[dependencies]
# The bundle format (docs/data-bundle.md, section 2 "Storage"): a manifest in
# JSON and an append-only log of Parquet partitions.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
arrow = { version = "60", default-features = false }
parquet = { version = "60", default-features = false, features = ["arrow", "snap", "zstd", "lz4"] }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
